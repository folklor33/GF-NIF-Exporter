<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gfmodel viewer</title>
<!--
  Throwaway validation viewer, grown across Phases 2-4.

  Not part of the Angular deliverable: this exists only to eyeball the exported
  geometry, UVs, materials, skinning and animation. Three.js comes from a CDN,
  everything else is inline, and there is no build step.

  Serve the repo root over HTTP so the exported files and the input textures are
  both reachable, e.g.:
      python -m http.server 8000
      http://localhost:8000/tools/viewer/?model=/out/monster/model/M011.gfmodel
-->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.5 system-ui,sans-serif; background:#15171c; color:#e6e8ee; overflow:hidden; }
  #ui { position:fixed; top:0; left:0; right:0; padding:10px 14px; background:#1d2027ee;
        border-bottom:1px solid #2e333d; display:flex; gap:14px; align-items:center; flex-wrap:wrap; z-index:10; }
  #ui label { cursor:pointer; }
  #stats { position:fixed; bottom:0; left:0; padding:8px 14px; background:#1d2027ee;
           border-top:1px solid #2e333d; border-right:1px solid #2e333d; font-family:ui-monospace,monospace;
           white-space:pre; z-index:10; max-height:45vh; overflow:auto; }
  input[type=text] { background:#12141a; border:1px solid #333a45; color:#e6e8ee; padding:5px 8px;
                     border-radius:4px; width:min(460px,42vw); font-family:ui-monospace,monospace; }
  button { background:#2b5cd6; border:0; color:#fff; padding:6px 12px; border-radius:4px; cursor:pointer; }
  button:hover { background:#3a6ae8; }
  .warn { color:#ffcc66; }
  .err  { color:#ff7b72; }
  .ok   { color:#7ee787; }
  #animbar { position:fixed; top:46px; left:0; right:0; padding:8px 14px; background:#1d2027ee;
             border-bottom:1px solid #2e333d; display:flex; gap:12px; align-items:center; z-index:10; }
  #animbar select { background:#12141a; border:1px solid #333a45; color:#e6e8ee; padding:5px 8px;
                    border-radius:4px; font-family:ui-monospace,monospace; max-width:40vw; }
  #animbar input[type=range] { flex:1; }
  #timeLabel { font-family:ui-monospace,monospace; white-space:nowrap; }
</style>
</head>
<body>
<div id="ui">
  <strong>gfmodel</strong>
  <input type="text" id="path" placeholder="/out/monster/model/M011.gfmodel">
  <button id="load">Load</button>
  <span>or</span>
  <input type="file" id="files" multiple accept=".gfmodel,.gfbin,.png">
  <label><input type="checkbox" id="wire"> wireframe</label>
  <label><input type="checkbox" id="tex" checked> textures</label>
  <label><input type="checkbox" id="vcol" checked> vertex colors</label>
  <label><input type="checkbox" id="zup" checked> Z-up &rarr; Y-up</label>
  <label><input type="checkbox" id="skel"> skeleton</label>
  <label><input type="checkbox" id="skin" checked> skinning</label>
  <label><input type="checkbox" id="particles" checked> particle markers</label>
</div>
<div id="animbar" style="display:none">
  <select id="clipSelect"></select>
  <button id="playPause">Pause</button>
  <input type="range" id="timeline" min="0" max="1" step="0.001" value="0">
  <span id="timeLabel">0.00 / 0.00</span>
</div>
<div id="stats">no model loaded</div>

<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

const statsEl = document.getElementById('stats');
const log = (html) => { statsEl.innerHTML = html; };

// ---------------------------------------------------------------- scene setup
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
renderer.domElement.style.position = 'fixed';
renderer.domElement.style.inset = '0';
renderer.domElement.style.zIndex = '1';

// CSS2DRenderer draws the particle-marker name labels as ordinary DOM text
// that stays screen-facing and correctly sized regardless of camera distance
// -- simpler and cheaper than a sprite-based text texture for a diagnostic
// overlay that is never meant to ship in the Angular consumer.
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
labelRenderer.domElement.style.position = 'fixed';
labelRenderer.domElement.style.inset = '0';
labelRenderer.domElement.style.zIndex = '2';
labelRenderer.domElement.style.pointerEvents = 'none';
document.body.appendChild(labelRenderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x15171c);

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.01, 100000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

scene.add(new THREE.AmbientLight(0xffffff, 1.4));
const key = new THREE.DirectionalLight(0xffffff, 2.0);
key.position.set(1, 2, 1.5);
scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.8);
fill.position.set(-1.5, -0.5, -1);
scene.add(fill);

const grid = new THREE.GridHelper(200, 20, 0x3a4150, 0x262b34);
scene.add(grid);

let root = new THREE.Group();
scene.add(root);

// Animation playback state, rebuilt on every load. mixer is null when the
// current model has no clips, which the UI reflects by hiding #animbar.
let mixer = null;
let activeAction = null;
let currentClips = [];
let bindPose = []; // snapshot of every bone's rest pose, restored before each clip starts
let scrubbing = false; // true while the timeline slider itself is being dragged

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  if (mixer && activeAction && activeAction.isRunning() && !scrubbing) {
    mixer.update(clock.getDelta());
    const t = activeAction.time % Math.max(activeAction.getClip().duration, 1e-6);
    document.getElementById('timeline').value = t;
    document.getElementById('timeLabel').textContent =
      `${t.toFixed(2)} / ${activeAction.getClip().duration.toFixed(2)}`;
  } else {
    clock.getDelta(); // keep the clock from jumping when playback resumes
  }
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
})();

// ------------------------------------------------------------------- building
// Maps the .gfmodel accessor descriptors onto BufferAttributes. Each accessor
// is {byteOffset, itemSize, count, type} into the single .gfbin buffer, so no
// parsing or reshaping is needed here -- the ranges are used as-is.
function attr(buffer, acc) {
  if (!acc || acc.count === 0) return null;
  const a = new Float32Array(buffer, acc.byteOffset, acc.count * acc.itemSize);
  return new THREE.BufferAttribute(a, acc.itemSize);
}

// uint16 skinIndex accessor. Kept separate from attr() because THREE wants an
// integer attribute here, not a float one.
function attrU16(buffer, acc) {
  if (!acc || acc.count === 0) return null;
  const a = new Uint16Array(buffer, acc.byteOffset, acc.count * acc.itemSize);
  return new THREE.BufferAttribute(a, acc.itemSize);
}

// Rebuilds one skeleton's bones as a THREE.Bone hierarchy.
//
// bindMatrixLocal is each bone's rest transform in its parent's space, already
// column-major, so it is decomposed straight onto the Bone. Bones come out of
// the exporter parent-before-child, so a single forward pass suffices.
function buildBones(skel) {
  const bones = skel.bones.map(b => {
    const bone = new THREE.Bone();
    bone.name = b.name;
    new THREE.Matrix4().fromArray(b.bindMatrixLocal)
      .decompose(bone.position, bone.quaternion, bone.scale);
    return bone;
  });
  const roots = [];
  skel.bones.forEach((b, i) => {
    if (b.parent < 0) roots.push(bones[i]);
    else bones[b.parent].add(bones[i]);
  });
  return { bones, roots };
}

// A clip only carries tracks for the bones it actually animates -- e.g. a
// clip with only XYZ_ROTATION_KEY tracks (translation/scale extracted,
// rotation left empty, see AnimationExtractor) never writes to a bone's
// quaternion at all. THREE.AnimationAction.stop() halts evaluation but does
// NOT restore untouched properties, so switching from a clip that moved a
// bone to one that doesn't touch it leaves that bone's last pose stuck.
// Resetting every bone to its recorded bind pose before starting a new clip
// is the only way to guarantee a clean slate each time.
function snapshotBindPose(bones) {
  return bones.map(b => ({
    bone: b,
    position: b.position.clone(),
    quaternion: b.quaternion.clone(),
    scale: b.scale.clone(),
  }));
}
function restoreBindPose(bindPose) {
  for (const s of bindPose) {
    s.bone.position.copy(s.position);
    s.bone.quaternion.copy(s.quaternion);
    s.bone.scale.copy(s.scale);
  }
}

// Reads one channel's {times, values} accessor pair straight out of the
// shared .gfbin -- same pattern as attr()/attrU16() above, just without
// wrapping the result in a BufferAttribute since THREE's *KeyframeTrack
// constructors want plain typed arrays.
function channelArrays(bin, ch) {
  if (!ch || ch.count === 0) return null;
  const times = new Float32Array(bin, ch.times.byteOffset, ch.count);
  const values = new Float32Array(bin, ch.values.byteOffset, ch.count * ch.values.itemSize);
  return { times, values };
}

// Builds one THREE.AnimationClip per exported AnimationClip.
//
// A skinned file's tracks target bones by the ".bones[boneName].quaternion"
// etc path (THREE's standard skeletal target, resolved against the mixer
// root's `.skeleton`) -- exactly how the source .kf's own name-based binding
// works. A skeleton-less file's tracks instead target a plain scene node by
// its own name ("nodeName.quaternion" etc, no ".bones[]" wrapper): THREE's
// PropertyBinding falls back to searching the object graph by `.name` for any
// path that isn't a special-cased ".bones[]"/".materials[]" form, so this
// needs no skeleton at all -- see SceneData::nodes / the exporter's
// AnimationTrack doc comment for why a track is never resolved against both.
// An orphaned track (boneIndex === -1, no matching target found by the
// exporter in either list) is skipped: THREE.PropertyBinding would warn on
// every frame for a path that resolves to nothing, so it is left out rather
// than passed through.
function buildAnimationClips(model, bin) {
  const hasSkeleton = (model.skeletons || []).length > 0;
  return (model.animations || []).map(clip => {
    const tracks = [];
    for (const t of clip.tracks) {
      if (t.boneIndex < 0) continue;
      const name = hasSkeleton ? `.bones[${t.boneName}]` : t.boneName;

      const rot = channelArrays(bin, t.rotation);
      if (rot) tracks.push(new THREE.QuaternionKeyframeTrack(name + '.quaternion', rot.times, rot.values));

      const trans = channelArrays(bin, t.translation);
      if (trans) tracks.push(new THREE.VectorKeyframeTrack(name + '.position', trans.times, trans.values));

      const scale = channelArrays(bin, t.scale);
      if (scale) {
        // Scale is stored as one float per key (uniform scale); THREE's
        // VectorKeyframeTrack for .scale wants xyz triples, so it is expanded.
        const expanded = new Float32Array(scale.values.length * 3);
        for (let i = 0; i < scale.values.length; i++) {
          expanded[i * 3] = expanded[i * 3 + 1] = expanded[i * 3 + 2] = scale.values[i];
        }
        tracks.push(new THREE.VectorKeyframeTrack(name + '.scale', scale.times, expanded));
      }
    }
    return new THREE.AnimationClip(clip.name || clip.originFile, clip.durationSeconds, tracks);
  });
}

// Rebuilds one exported node hierarchy (SceneData::nodes -- skeleton-less
// files only, see the exporter) as a plain THREE.Object3D tree, the same
// parent-before-child construction buildBones() uses for a THREE.Bone tree.
// A plain Object3D (not a Bone) is correct here: nothing about these nodes
// is meant to skin geometry, and PropertyBinding's name search works over
// any Object3D, not just bones.
function buildSceneNodes(nodes) {
  const objs = nodes.map(n => {
    const obj = new THREE.Object3D();
    obj.name = n.name;
    new THREE.Matrix4().fromArray(n.localMatrix)
      .decompose(obj.position, obj.quaternion, obj.scale);
    return obj;
  });
  const roots = [];
  nodes.forEach((n, i) => {
    if (n.parent < 0) roots.push(objs[i]);
    else objs[n.parent].add(objs[i]);
  });
  return { objs, roots };
}

// Places one small marker sphere + name label per exported particle system
// (Phase 5), parented under whichever bone/node its own attachNodeIndex
// resolved to -- exactly the mechanism buildAnimationClips already uses for
// bone/node tracks, so a marker under an animated bone moves with it for
// free via THREE's own matrix propagation, with no separate animation code
// needed here. This is the "does the attach point follow the right node"
// end-to-end check the brief asks for: no particle simulation is rendered,
// only where an emitter WOULD sit and whether it tracks its bone correctly.
function buildParticleMarkers(model, skeletons, sceneNodeObjs) {
  const markerGeo = new THREE.SphereGeometry(0.03, 8, 6);
  const markerMat = new THREE.MeshBasicMaterial({ color: 0xff5fd1, depthTest: false });
  const markers = [];
  let unresolved = 0;

  for (const p of model.particleSystems || []) {
    let parent = null;
    if (p.attachNodeIndex >= 0) {
      parent = p.attachNodeIsBone
        ? (skeletons[0] && skeletons[0].bones[p.attachNodeIndex])
        : (sceneNodeObjs && sceneNodeObjs.objs[p.attachNodeIndex]);
    }
    if (!parent) { unresolved++; continue; }

    const marker = new THREE.Mesh(markerGeo, markerMat);
    // The particle system's own local transform on top of its attach node,
    // exactly as ParticleSystemData::localMatrix documents.
    new THREE.Matrix4().fromArray(p.localMatrix)
      .decompose(marker.position, marker.quaternion, marker.scale);

    const label = document.createElement('div');
    label.textContent = p.name || '(unnamed)';
    label.style.cssText = 'color:#ff9fe6;font:11px ui-monospace,monospace;text-shadow:0 0 3px #000,0 0 3px #000;white-space:nowrap;';
    marker.add(new CSS2DObject(label));

    parent.add(marker); // rides the attach bone/node's own matrix automatically
    markers.push(marker);
  }
  return { markers, unresolved };
}

function buildScene(model, bin, textureUrlFor) {
  const group = new THREE.Group();
  const showTex = document.getElementById('tex').checked;
  const showVcol = document.getElementById('vcol').checked;
  const wire = document.getElementById('wire').checked;
  const showSkel = document.getElementById('skel').checked;
  const useSkin = document.getElementById('skin').checked;
  const loader = new THREE.TextureLoader();
  const notes = [];

  // One THREE bone hierarchy per exported skeleton, shared by every skinned
  // mesh that references it -- mirroring the exporter's own "one skeleton per
  // file" rule rather than rebuilding it per sub-mesh.
  const skeletons = (model.skeletons || []).map(s => {
    const { bones, roots } = buildBones(s);
    roots.forEach(r => group.add(r));
    roots.forEach(r => r.updateMatrixWorld(true));
    return { bones, roots, def: s };
  });

  // A skeleton-less file's embedded animation targets these directly (see
  // buildAnimationClips / buildSceneNodes) -- geometry that carries its own
  // NiTransformController with no skin anywhere in the file (a rotating
  // prop, a moving door). Empty for the overwhelming majority of files.
  const sceneNodeObjs = (model.nodes || []).length ? buildSceneNodes(model.nodes) : null;
  if (sceneNodeObjs) {
    sceneNodeObjs.roots.forEach(r => group.add(r));
    sceneNodeObjs.roots.forEach(r => r.updateMatrixWorld(true));
  }

  for (const m of model.meshes) {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', attr(bin, m.attributes.position));

    const n = attr(bin, m.attributes.normal);
    if (n) g.setAttribute('normal', n);
    const uv = attr(bin, m.attributes.uv);
    if (uv) g.setAttribute('uv', uv);

    const mat = model.materials[m.materialIndex] || {};
    const useVcol = showVcol && mat.hasVertexColor;
    if (useVcol) {
      const c = attr(bin, m.attributes.color);
      if (c) g.setAttribute('color', c);
    }

    const skinned = useSkin && m.isSkinned && skeletons[m.skeletonIndex];
    if (skinned) {
      const si = attrU16(bin, m.attributes.skinIndex);
      const sw = attr(bin, m.attributes.skinWeight);
      if (si && sw) {
        g.setAttribute('skinIndex', si);
        g.setAttribute('skinWeight', sw);
      }
    }

    const idx = new Uint32Array(bin, m.indices.byteOffset, m.indices.count);
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    if (!n) g.computeVertexNormals();
    g.computeBoundingSphere();

    const params = {
      side: THREE.DoubleSide,   // GF meshes are frequently single-sided planes
      wireframe: wire,
      vertexColors: useVcol,
      metalness: 0.0,
      roughness: 0.85,
    };
    if (mat.diffuse) params.color = new THREE.Color(...mat.diffuse);

    // NiAlphaProperty -> THREE.MeshStandardMaterial.
    //
    // Blend and test are genuinely different things and need different
    // depthWrite: blending needs depthWrite:false or a transparent surface
    // wrongly occludes whatever is behind it (writes to the depth buffer as
    // if it were opaque) -- this is exactly the "parasitic opaque plate"
    // symptom that motivated this fix. Alpha testing instead discards pixels
    // outright before shading, so what's left really is opaque and keeping
    // depthWrite:true is correct (and desirable -- cutout foliage/hair still
    // wants to occlude what's behind the kept pixels).
    const blend = !!mat.alphaBlendEnabled;
    const test = !!mat.alphaTestEnabled;
    params.opacity = mat.alpha !== undefined ? mat.alpha : 1;
    if (blend || params.opacity < 1) {
      params.transparent = true;
      params.depthWrite = false;
    }
    if (test) {
      params.alphaTest = (mat.alphaTestThreshold ?? 0) / 255;
      // Alpha test on its own does not need `transparent`, and if blending is
      // also on, depthWrite stays false from the branch above.
      if (!blend) params.depthWrite = true;
    }

    const material = new THREE.MeshStandardMaterial(params);

    if (showTex && mat.textureFound && mat.diffuseTexturePath) {
      const url = textureUrlFor(mat.diffuseTexturePath);
      if (url) {
        const t = loader.load(url,
          undefined, undefined,
          () => notes.push(`<span class="warn">texture failed to load: ${mat.diffuseTexturePath}</span>`));
        t.colorSpace = THREE.SRGBColorSpace;
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        // NIF UVs have V running the other way from glTF/Three.
        t.flipY = false;
        material.map = t;
      }
    } else if (mat.sourceTextureName && !mat.textureFound) {
      notes.push(`<span class="warn">unresolved texture: ${mat.sourceTextureName}</span>`);
    }

    if (skinned) {
      const sk = skeletons[m.skeletonIndex];
      // skinIndex values index this mesh's OWN binding list (glTF "joints"),
      // so the THREE.Skeleton is built from exactly those bones, in that order.
      const meshBones = m.skinBindings.map(b => sk.bones[b.bone]);
      // The exporter stores the complete bind-pose skin matrix per binding.
      // THREE wants boneInverses such that boneMatrix * boneInverse reproduces
      // it, and since it multiplies by the bone's current world matrix, the
      // inverse is that world matrix undone from the stored product.
      const boneInverses = m.skinBindings.map((b, i) => {
        const skinM = new THREE.Matrix4().fromArray(b.skinMatrix);
        const bw = meshBones[i].matrixWorld.clone();
        return bw.invert().multiply(skinM);
      });
      material.skinning = true;
      const sm = new THREE.SkinnedMesh(g, material);
      // The bind matrix must be identity: exported skinned positions are raw
      // shape-local, which is exactly the space the skin matrices consume.
      sm.bindMode = 'attached';
      sm.bind(new THREE.Skeleton(meshBones, boneInverses), new THREE.Matrix4());
      sm.frustumCulled = false; // bounds are for the bind pose, not the skin
      group.add(sm);
    } else {
      const plainMesh = new THREE.Mesh(g, material);
      // A mesh whose own node (or an ancestor) carries a real animation
      // track was exported with node-local vertices instead of the usual
      // flattened-world ones (see MeshData::nodeIndex / the exporter's
      // WA85 follow-up) specifically so it can be parented here and ride
      // the animated Object3D -- attaching it to `group` directly, as an
      // unskinned mesh normally is, would leave it at its rest pose forever
      // while the empty node animates on its own.
      const owner = m.nodeIndex >= 0 && sceneNodeObjs ? sceneNodeObjs.objs[m.nodeIndex] : null;
      (owner || group).add(plainMesh);
    }
  }

  if (showSkel) {
    for (const sk of skeletons) {
      for (const root of sk.roots) {
        const helper = new THREE.SkeletonHelper(root);
        helper.material.linewidth = 2;
        group.add(helper);
      }
    }
  }

  // THREE's ".bones[name]" PropertyBinding path (used by buildAnimationClips
  // below) only resolves against a node that exposes `.skeleton` -- normally
  // a SkinnedMesh. The mixer here is driven off `group` itself (so one mixer
  // can animate bones across every skinned mesh sharing a skeleton), so that
  // skeleton is exposed on `group` too. One skeleton per file, per the
  // exporter's own rule, so the first is the right one.
  if (skeletons.length) {
    group.skeleton = new THREE.Skeleton(skeletons[0].bones);
  }

  // NIF/Gamebryo is Z-up; Three.js is Y-up. The exporter deliberately keeps the
  // source axes (converting is a consumer-side decision, and Phase 3's skeleton
  // has to agree with whatever choice is made), so the viewer rotates for
  // display only.
  if (document.getElementById('zup').checked) {
    group.rotation.x = -Math.PI / 2;
  }

  let particleMarkers = [];
  let unresolvedParticleMarkers = 0;
  if (document.getElementById('particles').checked && (model.particleSystems || []).length) {
    const { markers, unresolved } = buildParticleMarkers(model, skeletons, sceneNodeObjs);
    particleMarkers = markers;
    unresolvedParticleMarkers = unresolved;
    if (unresolved) {
      notes.push(`<span class="warn">${unresolved} particle system(s) with an unresolved attach node (no marker shown)</span>`);
    }
  }

  const clips = buildAnimationClips(model, bin);
  const allBones = skeletons.flatMap(sk => sk.bones).concat(sceneNodeObjs ? sceneNodeObjs.objs : []);
  return { group, notes, clips, allBones, particleMarkers, unresolvedParticleMarkers };
}

function frame(group) {
  // setFromObject reads world matrices, so the Z-up rotation must be baked in
  // before the bounds are measured.
  group.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(group);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const radius = Math.max(size.x, size.y, size.z) * 0.5 || 1;

  controls.target.copy(center);
  camera.position.copy(center).add(new THREE.Vector3(radius * 2.2, radius * 1.6, radius * 2.2));
  camera.near = radius / 100;
  camera.far = radius * 100;
  camera.updateProjectionMatrix();
  controls.update();

  grid.position.set(center.x, box.min.y, center.z);
  grid.scale.setScalar(Math.max(radius / 10, 0.01));
}

// Remembers the last load so the wireframe/texture/vertex-color checkboxes can
// rebuild without re-fetching.
let lastReload = null;

function show(model, bin, textureUrlFor) {
  lastReload = () => show(model, bin, textureUrlFor);
  scene.remove(root);
  root.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
    // CSS2DObject labels are plain DOM nodes parented into labelRenderer's own
    // element tree, outside the WebGL scene graph -- traverse() still visits
    // them (they're THREE.Object3D children), but they need their DOM element
    // removed explicitly or the old model's labels linger on screen.
    if (o.isCSS2DObject) o.element.remove();
  });

  const { group, notes, clips, allBones, unresolvedParticleMarkers } = buildScene(model, bin, textureUrlFor);
  root = group;
  scene.add(root);
  frame(root);

  mixer = clips.length ? new THREE.AnimationMixer(root) : null;
  activeAction = null;
  currentClips = clips;
  // Captured once per load, after buildBones() has set every bone to its
  // bind pose and before any clip has run -- see restoreBindPose's use in
  // playClip.
  bindPose = snapshotBindPose(allBones);
  setupAnimBar(clips);

  const tris = model.meshes.reduce((a, m) => a + m.indexCount / 3, 0);
  const verts = model.meshes.reduce((a, m) => a + m.vertexCount, 0);
  const degen = model.meshes.reduce((a, m) => a + (m.degenerateTrianglesDropped || 0), 0);
  const strips = model.meshes.filter(m => m.sourceTopology === 'NiTriStrips').length;
  const missing = model.materials.filter(m => m.sourceTextureName && !m.textureFound).length;

  // Signal for the headless screenshot harness: set once geometry is in the
  // scene and framed. Textures may still be streaming in.
  window.__gfLoaded = { meshes: model.meshes.length, vertices: verts, triangles: tris };

  const skinnedMeshes = model.meshes.filter(m => m.isSkinned).length;
  const skels = model.skeletons || [];
  const boneTotal = skels.reduce((a, s) => a + s.bones.length, 0);
  const skinLine = skels.length
    ? `skeletons ${skels.length} (${boneTotal} bones, root "${skels[0].rootName}")   ` +
      `skinned meshes ${skinnedMeshes}/${model.meshes.length}`
    : `<span class="warn">no skeleton (static model)</span>`;

  const psys = model.particleSystems || [];
  const psysLine = psys.length
    ? `particle systems ${psys.length}   (markers shown: ${psys.length - unresolvedParticleMarkers})`
    : null;

  log([
    `<span class="ok">${model.sourceNif}</span>`,
    `meshes ${model.meshes.length}  (${strips} from NiTriStrips)   materials ${model.materials.length}`,
    `vertices ${verts.toLocaleString()}   triangles ${tris.toLocaleString()}   degenerate dropped ${degen.toLocaleString()}`,
    skinLine,
    ...(psysLine ? [psysLine] : []),
    missing ? `<span class="warn">${missing} material(s) with unresolved textures</span>` : `<span class="ok">all textures resolved</span>`,
    ...new Set(notes),
  ].join('\n'));
}

// --------------------------------------------------------------- loading: URL
async function loadFromPath(modelPath) {
  log('loading ' + modelPath + ' ...');
  const model = await (await fetch(modelPath)).json();
  const binPath = modelPath.replace(/[^/]+$/, model.binary);
  const bin = await (await fetch(binPath)).arrayBuffer();

  // diffuseTexturePath is written relative to wherever the exporter ran, e.g.
  // "input/monster/texture/M01101.png". Served from the repo root it just works.
  show(model, bin, p => '/' + p.replace(/^\/+/, ''));
}

// ------------------------------------------------------- loading: file picker
function loadFromFiles(fileList) {
  const files = [...fileList];
  const modelFile = files.find(f => f.name.endsWith('.gfmodel'));
  if (!modelFile) { log('<span class="err">pick a .gfmodel (and its .gfbin, plus any .png)</span>'); return; }

  const fr = new FileReader();
  fr.onload = () => {
    const model = JSON.parse(fr.result);
    const binFile = files.find(f => f.name === model.binary)
                 || files.find(f => f.name.endsWith('.gfbin'));
    if (!binFile) { log('<span class="err">missing ' + model.binary + '</span>'); return; }

    // Textures the user also picked, matched on basename.
    const pngs = new Map();
    for (const f of files) if (f.name.toLowerCase().endsWith('.png')) pngs.set(f.name.toLowerCase(), URL.createObjectURL(f));

    const fr2 = new FileReader();
    fr2.onload = () => show(model, fr2.result, p => pngs.get(p.split('/').pop().toLowerCase()) || null);
    fr2.readAsArrayBuffer(binFile);
  };
  fr.readAsText(modelFile);
}

// ------------------------------------------------------------- anim controls
// Rebuilds the clip dropdown for a freshly loaded model and starts the first
// clip playing, or hides the bar entirely when the model has none.
function setupAnimBar(clips) {
  const bar = document.getElementById('animbar');
  const select = document.getElementById('clipSelect');
  select.innerHTML = '';
  if (!clips.length) {
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';
  clips.forEach((c, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = `${c.name} (${c.duration.toFixed(2)}s, ${c.tracks.length} tracks)`;
    select.appendChild(opt);
  });
  playClip(0);
}

function playClip(index) {
  if (activeAction) activeAction.stop();
  // A clip only carries tracks for the bones/channels it actually animates
  // (e.g. an XYZ_ROTATION_KEY track has no quaternion keys at all -- see
  // buildAnimationClips). Restoring bind pose here means every bone starts
  // from a known-good rest state regardless of what the previous clip left
  // untouched.
  restoreBindPose(bindPose);
  const clip = currentClips[index];
  document.getElementById('timeline').max = clip.duration;
  document.getElementById('timeline').value = 0;
  activeAction = mixer.clipAction(clip);
  activeAction.reset().play();
  document.getElementById('playPause').textContent = 'Pause';
}

document.getElementById('clipSelect').onchange = e => playClip(+e.target.value);

document.getElementById('playPause').onclick = () => {
  if (!activeAction) return;
  activeAction.paused = !activeAction.paused;
  document.getElementById('playPause').textContent = activeAction.paused ? 'Play' : 'Pause';
};

// While the user drags the slider, playback is paused and the mixer is
// scrubbed directly (setTime), rather than fighting the animate loop's own
// mixer.update -- see the `scrubbing` guard there.
const timelineEl = document.getElementById('timeline');
timelineEl.oninput = () => {
  if (!activeAction) return;
  scrubbing = true;
  const t = +timelineEl.value;
  mixer.setTime(t);
  document.getElementById('timeLabel').textContent =
    `${t.toFixed(2)} / ${activeAction.getClip().duration.toFixed(2)}`;
};
timelineEl.onchange = () => { scrubbing = false; };

// ------------------------------------------------------------------- wiring
const pathInput = document.getElementById('path');
document.getElementById('load').onclick = () => {
  if (pathInput.value.trim()) loadFromPath(pathInput.value.trim()).catch(e => log('<span class="err">' + e + '</span>'));
};
pathInput.onkeydown = e => { if (e.key === 'Enter') document.getElementById('load').click(); };
document.getElementById('files').onchange = e => loadFromFiles(e.target.files);

for (const id of ['wire', 'tex', 'vcol', 'zup', 'skel', 'skin', 'particles']) {
  document.getElementById(id).onchange = () => { if (lastReload) lastReload(); };
}

const qs = new URLSearchParams(location.search).get('model');
if (qs) { pathInput.value = qs; loadFromPath(qs).catch(e => log('<span class="err">' + e + '</span>')); }
else log('Enter a path like /out/monster/model/M011.gfmodel, or pick files.\nServe the repo root over HTTP so textures resolve.');
</script>
